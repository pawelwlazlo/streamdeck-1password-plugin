<!DOCTYPE html>
<html>

<head lang="en">
    <title>1Password Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <style>
        summary {
            cursor: pointer;
            padding: 6px 0 2px 11px;
            user-select: none;
        }

        .hint {
            opacity: 0.8;
        }

        sdpi-item[hidden] {
            display: none;
        }

        .error {
            color: #e06c6c;
        }
    </style>
</head>

<body>
    <details id="account">
        <summary>1Password account</summary>
        <sdpi-item label="Account">
            <sdpi-textfield id="accountName" setting="accountName" global placeholder="Email you sign in with"></sdpi-textfield>
        </sdpi-item>
        <sdpi-item>
            <span id="accountHint" class="hint" hidden>In the 1Password app turn on Settings → Developer → Integrate with other apps, then enter the email you sign in with.</span>
            <span id="accountNote" class="hint" hidden>Shared by all 1Password keys.</span>
            <span id="accountError" class="error" hidden></span>
        </sdpi-item>
    </details>
    <div id="itemSettings" hidden>
        <sdpi-item label="Vault">
            <sdpi-select id="vault" setting="vaultId" datasource="getVaults" loading="Loading vaults..." placeholder="Select a vault"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Item">
            <sdpi-select id="item" setting="itemId" datasource="getItems" loading="Loading items..." placeholder="Select an item"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Click">
            <sdpi-select class="gesture" setting="pressTarget" datasource="getFields" loading="Loading fields..." placeholder="Do nothing"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Output" class="output" data-gesture="pressTarget" hidden>
            <sdpi-select setting="pressOutput" default="copy">
                <option value="copy">Copy</option>
                <option value="paste">Paste</option>
                <option value="type">Type</option>
            </sdpi-select>
        </sdpi-item>
        <sdpi-item label="Double click">
            <sdpi-select class="gesture" setting="doublePressTarget" datasource="getFields" loading="Loading fields..." placeholder="Do nothing"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Output" class="output" data-gesture="doublePressTarget" hidden>
            <sdpi-select setting="doublePressOutput" default="copy">
                <option value="copy">Copy</option>
                <option value="paste">Paste</option>
                <option value="type">Type</option>
            </sdpi-select>
        </sdpi-item>
        <sdpi-item label="Hold">
            <sdpi-select class="gesture" setting="holdTarget" datasource="getFields" loading="Loading fields..." placeholder="Do nothing"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Output" class="output" data-gesture="holdTarget" hidden>
            <sdpi-select setting="holdOutput" default="copy">
                <option value="copy">Copy</option>
                <option value="paste">Paste</option>
                <option value="type">Type</option>
            </sdpi-select>
        </sdpi-item>
    </div>

    <script src="onepassword-common.js"></script>
    <script>
        function refreshGestures() {
            setTimeout(() => document.querySelectorAll(".gesture").forEach((gesture) => gesture.refresh()), 0);
        }

        vault.addEventListener("valuechange", refreshGestures);
        item.addEventListener("valuechange", refreshGestures);

        function showOutput(gesture) {
            const output = document.querySelector(`.output[data-gesture="${gesture.getAttribute("setting")}"]`);
            output.hidden = !String(gesture.value || "").startsWith("field:");
        }

        document.querySelectorAll(".gesture").forEach((gesture) => {
            gesture.addEventListener("valuechange", () => showOutput(gesture));
        });
    </script>
</body>

</html>
