<!DOCTYPE html>
<html>

<head lang="en">
    <title>1Password Item Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Service account token">
        <sdpi-password setting="serviceAccountToken" global></sdpi-password>
    </sdpi-item>
    <sdpi-item label="Vault">
        <sdpi-select id="vault" setting="vaultId" datasource="getVaults" loading="Loading vaults..." placeholder="Select a vault"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Item">
        <sdpi-select id="item" setting="itemId" datasource="getItems" loading="Loading items..." placeholder="Select an item"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Hold action">
        <sdpi-select setting="longPressMode" default="open">
            <option value="open">Open website and copy password</option>
            <option value="otp">Copy one-time password</option>
        </sdpi-select>
    </sdpi-item>

    <script>
        document.getElementById("vault").addEventListener("valuechange", () => {
            setTimeout(() => document.getElementById("item").refresh(), 0);
        });
    </script>
</body>

</html>
