<!DOCTYPE html>
<html>

<head lang="en">
    <title>1Password Item Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <style>
        summary {
            cursor: pointer;
            padding: 6px 0 2px 11px;
            user-select: none;
        }

        .hint {
            opacity: 0.8;
        }

        .error {
            color: #e06c6c;
        }
    </style>
</head>

<body>
    <details id="account">
        <summary>1Password account</summary>
        <sdpi-item label="Account">
            <sdpi-textfield id="accountName" setting="accountName" global placeholder="Email you sign in with"></sdpi-textfield>
        </sdpi-item>
        <sdpi-item>
            <span id="accountHint" class="hint" hidden>In the 1Password app turn on Settings → Developer → Integrate with other apps, then enter the email you sign in with.</span>
            <span id="accountNote" class="hint" hidden>Shared by all 1Password keys.</span>
            <span id="accountError" class="error" hidden></span>
        </sdpi-item>
    </details>
    <div id="itemSettings" hidden>
        <sdpi-item label="Vault">
            <sdpi-select id="vault" setting="vaultId" datasource="getVaults" loading="Loading vaults..." placeholder="Select a vault"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Item">
            <sdpi-select id="item" setting="itemId" datasource="getItems" loading="Loading items..." placeholder="Select an item"></sdpi-select>
        </sdpi-item>
        <sdpi-item label="Hold action">
            <sdpi-select setting="longPressMode" default="open">
                <option value="open">Open website and copy password</option>
                <option value="otp">Copy one-time password</option>
            </sdpi-select>
        </sdpi-item>
    </div>

    <script>
        const streamDeckClient = SDPIComponents.streamDeckClient;
        const accountDetails = document.getElementById("account");
        const accountField = document.getElementById("accountName");
        const accountHint = document.getElementById("accountHint");
        const accountNote = document.getElementById("accountNote");
        const accountError = document.getElementById("accountError");
        const itemSettings = document.getElementById("itemSettings");
        const vault = document.getElementById("vault");
        const item = document.getElementById("item");

        const ACCOUNT_CHANGE_DEBOUNCE_MS = 600;
        let knownAccountName;
        let vaultsError = "";

        function render() {
            const configured = Boolean(knownAccountName);
            const showError = configured && Boolean(vaultsError);
            itemSettings.hidden = !configured;
            accountHint.hidden = configured;
            accountNote.hidden = !configured;
            accountError.hidden = !showError;
            accountError.textContent = showError ? vaultsError : "";
            if (!configured || showError) {
                accountDetails.open = true;
            }
        }

        streamDeckClient.getGlobalSettings().then((settings) => {
            knownAccountName = settings.accountName || "";
            render();
        });

        streamDeckClient.sendToPropertyInspector.subscribe((message) => {
            if (message.payload?.event !== "getVaults") {
                return;
            }
            vaultsError = message.payload.error || "";
            if (knownAccountName !== undefined) {
                render();
            }
        });

        let accountChangeTimer;
        accountField.addEventListener("valuechange", () => {
            clearTimeout(accountChangeTimer);
            accountChangeTimer = setTimeout(() => {
                const accountName = accountField.value || "";
                if (accountName === knownAccountName) {
                    return;
                }
                knownAccountName = accountName;
                vaultsError = "";
                render();
                if (accountName) {
                    vault.refresh();
                }
            }, ACCOUNT_CHANGE_DEBOUNCE_MS);
        });

        vault.addEventListener("valuechange", () => {
            setTimeout(() => item.refresh(), 0);
        });
    </script>
</body>

</html>
